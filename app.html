<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التوجيه إلى المتجر...</title>
    
    <!-- تحويل تلقائي سريع جداً بعد ثانية واحدة احتياطياً -->
    <meta http-equiv="refresh" content="1;url=https://play.google.com/store/apps/details?id=com.flet.astronomy">

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin-bottom: 10px;
            font-size: 20px;
            color: #2c3e50;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #219150;
        }
    </style>

    <script>
        // رابط التطبيق على جوجل بلاي
        const playStoreUrl = "https://play.google.com/store/apps/details?id=com.flet.astronomy";

        // توجيه تلقائي فور تحميل الصفحة
        window.onload = function() {
            setTimeout(function() {
                window.location.href = playStoreUrl;
            }, 300); // تحويل بعد 0.3 ثانية لتوفير تجربة سلاسة للمستخدم
        };
    </script>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h2>جاري تحويلك للمتجر...</h2>
        <p>إذا لم يتم تحويلك تلقائياً خلال ثوانٍ، اضغط على الزر أدناه:</p>
        <a id="download-link" href="#" class="btn">الانتقال إلى متجر Google Play</a>
    </div>

    <script>
        document.getElementById('download-link').href = playStoreUrl;
    </script>

</body>
</html>
